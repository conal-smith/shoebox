<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf8f4">
<title>Photos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/photoswipe.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<section id="hero">
  <div class="show" id="show"></div>
  <div class="shade"></div>
  <div class="title">
    <h1 class="serif" id="title"></h1>
    <div class="where" id="where"></div>
    <div class="actions">
      <button class="btn solid" id="enter"></button>
      <button class="btn" id="tv-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8"/></svg>Play on TV</button>
    </div>
  </div>
  <div class="now" id="now"></div>
  <div class="scroll">Scroll ↓</div>
</section>

<div class="bar" id="bar">
  <div class="top">
    <span class="mono serif" id="mono"></span>
    <nav class="chapters" id="chapter-links"></nav>
    <button class="icon" id="share" title="Share the link" aria-label="Share the link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M6 12v7h12v-7"/></svg></button>
  </div>
  <div class="people" id="people" aria-label="People"></div>
  <div class="filter-note" id="note"></div>
</div>

<main>
  <div id="chapters"></div>
  <nav class="rail" id="rail" aria-label="Timeline"></nav>
</main>

<div id="tv" hidden>
  <button class="btn solid start" id="tv-start">Start slideshow</button>
  <div class="cap" id="tv-cap"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
