<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf8f4">
<title>Photos</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <h1>Photos</h1>
  <p class="where"></p>
  <form id="form" autocomplete="off">
    <label for="code">Enter the passcode to see the photos</label>
    <input id="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••" autofocus required>
    <button type="submit">View photos</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</main>
<a class="brand" href="https://github.com/conal-smith/shoebox" target="_blank" rel="noopener"><img src="/shoebox.svg" alt="" width="22" height="22">shoebox</a>
<script src="/login.js"></script>
</body>
</html>
